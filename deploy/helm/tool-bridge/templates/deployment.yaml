{{- include "tool-bridge.validate" . -}}
{{- if .Values.bootstrap.existingClaim }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tool-bridge.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tool-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tool-bridge.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: {{ include "tool-bridge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          volumeMounts:
            - name: bootstrap
              mountPath: /data
          livenessProbe:
            httpGet: { path: /livez, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: bootstrap
          persistentVolumeClaim:
            claimName: {{ .Values.bootstrap.existingClaim | quote }}
{{- end }}
