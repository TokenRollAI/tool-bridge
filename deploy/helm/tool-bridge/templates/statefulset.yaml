{{- include "tool-bridge.validate" . -}}
{{- if not .Values.bootstrap.existingClaim }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tool-bridge.fullname" . }}
spec:
  serviceName: {{ include "tool-bridge.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tool-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tool-bridge.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: {{ include "tool-bridge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 8787
          volumeMounts:
            - name: bootstrap
              mountPath: /data
          livenessProbe:
            httpGet: { path: /livez, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: bootstrap
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.bootstrap.storageClass }}
        storageClassName: {{ .Values.bootstrap.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.bootstrap.size }}
{{- end }}
