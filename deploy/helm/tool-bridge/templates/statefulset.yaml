{{/*
standalone 形态(SQLite / 本地对象):StatefulSet + PVC,副本数恒 1
(validate 已拒绝 >1)。用 StatefulSet 而非 Deployment+PVC:RWO 卷上滚动更新
不会出现"新 Pod 等旧 Pod 释放卷"的死锁,替换顺序由控制器保证。
*/}}
{{- include "tool-bridge.validate" . -}}
{{- if not (include "tool-bridge.stateless" .) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tool-bridge.fullname" . }}
  labels:
    {{- include "tool-bridge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "tool-bridge.fullname" . }}
  selector:
    matchLabels:
      {{- include "tool-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tool-bridge.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "tool-bridge.podSpec" . | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
