{{/*
信任根与后端凭证。secrets.existingSecret 非空时不渲染(全部 key 由外部 Secret 提供)。
helm upgrade 会随 values 变化更新;轮换 Admin SK 请走管理面,不要改这里的引导值。
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tool-bridge.fullname" . }}
  labels:
    {{- include "tool-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  TB_BOOTSTRAP_ADMIN_SK: {{ required "secrets.bootstrapAdminSk 必填" .Values.secrets.bootstrapAdminSk | quote }}
  TB_SECRET_ENCRYPTION_KEY: {{ required "secrets.encryptionKey 必填" .Values.secrets.encryptionKey | quote }}
  {{- if .Values.postgres.url }}
  TB_DATABASE_URL: {{ .Values.postgres.url | quote }}
  {{- end }}
  {{- if .Values.redis.url }}
  TB_REDIS_URL: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if .Values.objectStore.endpoint }}
  TB_OBJECT_STORE_ACCESS_KEY_ID: {{ .Values.objectStore.accessKeyId | quote }}
  TB_OBJECT_STORE_SECRET_ACCESS_KEY: {{ .Values.objectStore.secretAccessKey | quote }}
  {{- end }}
{{- end }}
