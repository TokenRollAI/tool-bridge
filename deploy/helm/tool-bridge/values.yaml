# Install PostgreSQL and S3 separately, then configure them through paired Dashboard setup.
image:
  repository: ghcr.io/tokenrollai/tool-bridge
  tag: '0.22.0'
  pullPolicy: IfNotPresent
replicaCount: 1
nameOverride: ''
fullnameOverride: ''
bootstrap:
  existingClaim: ''
  size: 1Gi
  storageClass: ''
  # Multiple replicas need the same initialized bootstrap state on an RWX claim.
  shared: false
service:
  type: ClusterIP
  port: 8787
ingress:
  enabled: false
  host: ''
  className: ''
  annotations: {}
  tls: []
resources:
  requests:
    cpu: 100m
    memory: 256Mi
