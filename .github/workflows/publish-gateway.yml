# 备注:发布走 npm Trusted Publishing(OIDC,免 token)。前置一次性配置见 npmjs.com 包设置页:
# Package Settings → Trusted Publisher → GitHub Actions,
# repo `TokenRollAI/tool-bridge`,workflow `publish-gateway.yml`。

name: publish-gateway

on:
  push:
    tags:
      - 'gateway-v*' # 打 tag 即发布:git tag gateway-v0.1.0 && git push origin gateway-v0.1.0
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing(OIDC)必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1(setup-node 自带的可能偏旧)。
      # 钉 11.x:npm 12.0.0(2026-07-08 发布)publish 缺 sigstore 模块直接崩(MODULE_NOT_FOUND)。
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # tag 版本与 package.json 一致性校验(防止 tag 与包版本漂移)
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#gateway-v}"
          PKG_VERSION="$(node -p "require('./packages/gateway/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag gateway-v$TAG_VERSION != package.json $PKG_VERSION" >&2
            exit 1
          fi

      # gateway 把 core 与宿主中立层 app 一并 bundle 进产物,三包 typecheck 一起过
      - run: pnpm --filter @tool-bridge/core --filter @tool-bridge/app --filter @tool-bridge/gateway typecheck
      # gateway 套件只覆盖 CF 宿主那一层(DO/D1/R2/Assets),树本身的行为在 app 的
      # Node 套件里;产物含两者,故两套都是发布闸门。
      - run: pnpm --filter @tool-bridge/core --filter @tool-bridge/app --filter @tool-bridge/gateway test
      - run: pnpm --filter @tool-bridge/gateway build

      # pnpm pack 同时应用 publishConfig 覆盖与 catalog/workspace 版本改写;
      # verifier 对最终 tarball 做协议扫描和仓库外 npm 安装,发布只能消费该 tarball。
      - name: Pack and verify npm tarball
        run: |
          TARBALL="$(node scripts/pack-and-verify-package.mjs packages/gateway \
            --output-dir "$RUNNER_TEMP/gateway")"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish "$TARBALL"
