# 一轮发布的编排器:**一次 dispatch 发完所有待发包**,不必手工打 N 个 tag。
#
# 为什么是"触发既有 workflow"而不是"合成一个大 workflow":
#   npm Trusted Publishing 的信任是按 **workflow 文件名**授予的(每个包在 npmjs.com 上
#   配的是 `publish-<pkg>.yml`)。把发布动作搬进本文件 = 7 个包都要重配 Trusted Publisher,
#   而配错的表现是发布时 OIDC 失败。故本文件只做编排:算顺序 → 逐个 `gh workflow run`
#   → 等每个跑完再触发下一个。零 OIDC 改动,失败隔离也保留(某个包挂了不影响已发的)。
#
# 打 tag 的活也交给它:tag 仍然会被创建(那是发布的审计痕迹,也是 publish-*.yml 里
# 版本一致性校验的输入),只是不用人一个一个 `git push` —— 实测一次推多个 tag
# **不触发**任何 tag workflow,那个坑本身就是"必须逐个推"的来源。
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只打印计划,不打 tag、不触发发布'
        type: boolean
        default: true
      packages:
        description: '限定/恢复包(逗号分隔);自动补前置,显式包可已发 npm;留空 = 全部 npm 待发包'
        type: string
        default: ''

concurrency:
  # 发布不可并发:两轮同时跑会让 dashboard→server 的顺序保证失效。
  group: release
  cancel-in-progress: false

permissions:
  contents: write # 打 tag
  actions: write # 触发 publish-*.yml

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      order: ${{ steps.plan.outputs.order }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@v4

      # **不设 `cache: pnpm`**:本 job 只跑一个纯读脚本(零依赖,只用 node 内置模块与
      # fetch),从不 `pnpm install` —— 而 setup-node 的 pnpm 缓存在 post 步骤要求 store
      # 路径存在,不装依赖就会以 "Path Validation Error" 让**整个 job 失败**,
      # 于是 plan 明明算对了、needs 却判定失败把 release job 跳过(实测 run 31812060455)。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 只发 main 上的东西:tag 一推 CI 就发 npm,而 npm 版本号不可回收 ——
      # 从未合入的分支发布过的版本号再也拿不回来。
      - name: Refuse to release off main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "release 只能从 main 运行(当前 ${GITHUB_REF_NAME})" >&2
            exit 1
          fi

      - id: plan
        name: Compute release plan
        run: |
          set -o pipefail
          PLAN_FILE="$RUNNER_TEMP/release-plan.json"
          # 一次 registry snapshot 同时生成人类摘要与机器计划。不重跑
          # release-plan:否则 registry 在两次请求间更新时,summary 与 ORDER 会互相矛盾。
          node scripts/release-plan.mjs --json-file "$PLAN_FILE" | tee plan.txt
          PLAN="$(cat "$PLAN_FILE")"
          # 子集不能直接 filter：server 依赖待发 dashboard 时必须
          # 自动把 dashboard 加回来，并沿用 release-plan 已验证的拓扑顺序。
          ORDER="$(printf '%s' "$PLAN" | node scripts/select-release-packages.mjs "$ONLY")"
          echo "本次实际顺序:$ORDER" | tee -a plan.txt
          echo "order=$ORDER" >> "$GITHUB_OUTPUT"
          if [ "$ORDER" = "[]" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; fi
        env:
          ONLY: ${{ inputs.packages }}

      - name: Summary
        run: |
          {
            echo '## 发布计划'
            echo '```'
            cat plan.txt
            echo '```'
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo '> dry-run:没有打 tag、没有触发发布。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: ${{ inputs.dry-run == false && needs.plan.outputs.empty != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 逐个:打 tag → 触发对应 publish workflow → 等它结束。
      # **串行是有意的**:dashboard 必须先于 server 真正发布完成(不只是"先触发"),
      # 否则 server 的 pack 会写进一个 registry 上还不存在的 dashboard 版本。
      - name: Publish in dependency order
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORDER: ${{ needs.plan.outputs.order }}
        run: |
          set -euo pipefail

          registry_state() {
            node scripts/npm-registry-version.mjs "$1" "$2"
          }

          for PKG in $(echo "$ORDER" | node -e "
            console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).join(' '))
          "); do
            PACKAGE_NAME="$(node -p "require('./packages/$PKG/package.json').name")"
            VERSION="$(node -p "require('./packages/$PKG/package.json').version")"
            TAG="$PKG-v$VERSION"

            echo "::group::$TAG"

            # 计划与执行之间 registry 可能已更新；记下精确版本状态。
            # 不在这里整包 continue：server/CLI 还有镜像产物需要独立恢复。
            NPM_STATE="$(registry_state "$PACKAGE_NAME" "$VERSION")"

            # 记下时刻:下面只认这之后创建的 run。同名 tag 可能被删过重推(发布失败的
            # 既有恢复手法),那些**历史失败 run** 的 headBranch 与新的一模一样,
            # 不按时间过滤会让 `gh run watch --exit-status` 盯上一个早已失败的旧 run。
            SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            TAG_REF_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
            if [ -n "$TAG_REF_SHA" ]; then
              TAG_PEELED_SHA="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')"
              TAG_COMMIT_SHA="${TAG_PEELED_SHA:-$TAG_REF_SHA}"
              if [ "$TAG_COMMIT_SHA" != "$GITHUB_SHA" ]; then
                echo "tag $TAG 指向 $TAG_COMMIT_SHA，当前 main 是 $GITHUB_SHA；拒绝在旧 tag 上发布新源码" >&2
                exit 1
              fi
              echo "tag $TAG 已存在且指向当前 main，re-dispatch 未完成版本"
            else
              git tag "$TAG"
              git push origin "$TAG"
              echo "pushed $TAG at $SINCE"
            fi

            # **必须显式 `gh workflow run`,不能指望 tag push 触发。**
            # GitHub 刻意不让用 `GITHUB_TOKEN` 推的 tag 触发其它 workflow(防无限递归),
            # 故这里 push 完**什么都不会发生** —— 实测 run 31812567922:`app-v0.4.0` 推成功、
            # 零 workflow 被触发,整轮发布就停在第一个包。
            #
            # 在 tag ref 上 dispatch 与 tag 触发等价:`publish-*.yml` 都声明了
            # `workflow_dispatch`,且它们的「tag 版本 == package.json 版本」校验用的是
            # `GITHUB_REF_NAME`,在 tag ref 上照样成立(实测 app@0.4.0 由此发出)。
            #
            # `server-v*` 对应**两个** workflow(publish-server 发 npm、publish-docker 推
            # GHCR 镜像),两个都要 dispatch 并等 —— 镜像也是发布物,失败不该被静默放过。
            WORKFLOWS="publish-$PKG.yml"
            if [ "$PKG" = 'server' ]; then WORKFLOWS="$WORKFLOWS publish-docker.yml"; fi
            RUNS=''
            for WF in $WORKFLOWS; do
              # 同 tag/同 commit 的成功 run 直接复用；正在跑的则直接 watch，
              # 避免重复 dispatch 造成两个 npm publish 竞态。历史失败 run 才重发。
              RUN_STATE="$(gh run list --workflow "$WF" --limit 40 \
                --json databaseId,headBranch,headSha,status,conclusion \
                --jq "[.[] | select(.headBranch == \"$TAG\" and .headSha == \"$GITHUB_SHA\")][0] \
                      | if . == null then \"\" \
                        else [.databaseId, .status, (.conclusion // \"\")] | @tsv end")"
              EXISTING_RUN_ID=''
              EXISTING_RUN_STATUS=''
              EXISTING_RUN_CONCLUSION=''
              if [ -n "$RUN_STATE" ]; then
                IFS=$'\t' read -r EXISTING_RUN_ID EXISTING_RUN_STATUS EXISTING_RUN_CONCLUSION <<< "$RUN_STATE"
              fi

              if [ "$EXISTING_RUN_STATUS" = 'completed' ] \
                && [ "$EXISTING_RUN_CONCLUSION" = 'success' ]; then
                echo "reuse successful $WF run $EXISTING_RUN_ID"
                continue
              fi
              case "$EXISTING_RUN_STATUS" in
                queued|in_progress|pending|requested|waiting)
                  echo "reuse active $WF run $EXISTING_RUN_ID"
                  RUNS="${RUNS:+$RUNS }$EXISTING_RUN_ID"
                  continue
                  ;;
              esac

              # npm 精确版本已存在时，纯 npm workflow 无需再发。
              # CLI 例外：同一 workflow 还发镜像，且其 npm step 已做幂等跳过。
              if [ "$NPM_STATE" = 'present' ] \
                && [ "$WF" = "publish-$PKG.yml" ] \
                && [ "$PKG" != 'cli' ]; then
                echo "$PACKAGE_NAME@$VERSION 已在 registry，跳过 $WF"
                continue
              fi

              DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              gh workflow run "$WF" --ref "$TAG"
              echo "dispatched $WF on $TAG"
              RUN_ID=''
              for _ in $(seq 1 30); do
                RUN_ID="$(gh run list --workflow "$WF" --event workflow_dispatch --limit 20 \
                  --json databaseId,headBranch,headSha,createdAt \
                  --jq "[.[] | select(.headBranch == \"$TAG\" and .headSha == \"$GITHUB_SHA\" \
                        and .createdAt >= \"$DISPATCHED_AT\")][0].databaseId // empty")"
                if [ -n "$RUN_ID" ]; then break; fi
                sleep 5
              done
              if [ -z "$RUN_ID" ]; then
                echo "等不到 $WF@$TAG 的 run(tag 已推,去 Actions 页查看)" >&2
                exit 1
              fi
              RUNS="${RUNS:+$RUNS }$RUN_ID"
            done

            for RUN_ID in $RUNS; do
              echo "watching run $RUN_ID"
              gh run watch "$RUN_ID" --exit-status
            done

            # npm publish 成功不等于 registry CDN 已能安装。等精确版本
            # 可见再发下一包，否则 server 会在 dashboard 传播窗口内失败。
            REGISTRY_READY=false
            for _ in $(seq 1 36); do
              if [ "$(registry_state "$PACKAGE_NAME" "$VERSION")" = 'present' ]; then
                REGISTRY_READY=true
                break
              fi
              sleep 5
            done
            if [ "$REGISTRY_READY" != true ]; then
              echo "$PACKAGE_NAME@$VERSION 发布 workflow 已成功，但 registry 180s 内仍不可见" >&2
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          echo '## 发布结果见上面各 group' >> "$GITHUB_STEP_SUMMARY"
          echo '编排器已在每个包后等待 registry 精确版本可见，再继续下一包。' >> "$GITHUB_STEP_SUMMARY"
