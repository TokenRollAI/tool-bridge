# 主干与 PR 的测试门:与本地 `pnpm verify` 同一条验收链
# (typecheck → lint → 单测 → 集成测试)。发布 workflow 只在打 tag 时跑,
# 这里补上"合入前必须全绿"的缺口。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # verify 不含 build:tsup/dts 的断裂(如 dts.resolve 配错、external 清单漂移)
      # 只在发布 workflow 里才暴露,届时 tag 已推、版本已定,返工代价高。
      # 全量 build 约 6s,在这里当闸门最便宜。
      - run: pnpm turbo run build
