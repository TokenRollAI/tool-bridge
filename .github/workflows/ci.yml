# 主干与 PR 保留 pnpm verify 的全部验收项,在独立 runner 上并行执行。
# verify 是统一总闸门;任何检查失败、取消或意外跳过都不能通过。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本提醒需要 PR merge-base,不能用默认 shallow checkout 静默跳过。
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci
        id: setup

      # 只复用确定性的类型检查/构建任务,测试每次真实执行。
      # 根配置与 scripts(含 Dashboard precompress)也参与外层 key;
      # 包源码和依赖闭包由 Turbo 自身的 task hash 再判断是否命中。
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.node-version }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', 'tsconfig*.json', 'eslint.config.mjs', 'scripts/**', '.github/actions/**', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.node-version }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', 'tsconfig*.json', 'eslint.config.mjs', 'scripts/**', '.github/actions/**', '.github/workflows/ci.yml') }}-

      - run: pnpm typecheck
        env:
          TURBO_CONCURRENCY: '1'

      - run: pnpm lint

      # 包外的发布、Dockerfile、部署过滤与 Compose 快照回归同样是硬闸门。
      - name: Repository contract tests
        run: node --test scripts/*.test.mjs

      # public artifact ownership 仍由人判断,机器仅提醒。
      - name: Warn on unbumped public packages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-version-bumps.mjs "$BASE_REF"

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci

      # 每台 runner 只跑一个包的 Vitest pool,防止 DOM timers 因 CPU 争用超时。
      # 直接跑源码测试:类型检查已由 quality 承担,不在每个 runner 重算 ^typecheck。
      # 排除集成测试包而非穷举单测包,新增 workspace 包会自动进入此闸门。
      - name: Unit tests
        run: >-
          pnpm --recursive --workspace-concurrency=1
          --filter '!@tool-bridge/app' --filter '!@tool-bridge/server' test

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci

      # Server globalSetup starts isolated PostgreSQL/S3/Redis containers and fails if Docker is unavailable.
      - name: Integration tests
        run: >-
          pnpm --recursive --workspace-concurrency=1
          --filter @tool-bridge/app --filter @tool-bridge/server test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
        id: setup

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.node-version }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', 'tsconfig*.json', 'eslint.config.mjs', 'scripts/**', '.github/actions/**', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.node-version }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', 'tsconfig*.json', 'eslint.config.mjs', 'scripts/**', '.github/actions/**', '.github/workflows/ci.yml') }}-

      # 声明与最终产物必须过闸;命中缓存时 Turbo 恢复同一 task hash 的 dist。
      - run: pnpm turbo run build

      # 合入前检查所有 public package 的最终 tarball manifest。这里故意跳过仓库外安装:
      # server 可能引用同一 PR 中尚未发布的 dashboard 新版本;真实安装留在按依赖顺序运行的
      # publish workflow。两处复用同一个 verifier,避免 pack 路径再次分叉。
      - name: Verify packed public package manifests
        run: |
          for PKG in app cli dashboard plugin-sdk sdk server; do
            node scripts/pack-and-verify-package.mjs "packages/$PKG" \
              --output-dir "$RUNNER_TEMP/$PKG" --skip-install
          done

  verify:
    if: ${{ always() }}
    needs: [quality, test-unit, test-integration, build, deploy-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  # 部署产物是纯声明文件,没有测试兜底 —— 模板语法错、危险组合校验失效只会在用户
  # helm install 时暴露。这里把 lint、双形态渲染与负向用例(必须 fail 的组合真的 fail)
  # 都钉成硬闸门;compose 同理做语法与必填检查。全程秒级。
  deploy-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Helm lint + render both shapes
        working-directory: deploy/helm/tool-bridge
        run: |
          helm lint . -f examples/values-standalone.yaml
          helm lint . -f examples/values-ha.yaml
          # standalone → StatefulSet;HA → Deployment。渲染断言防两形态判定回归。
          helm template tb . -f examples/values-standalone.yaml | grep -q "^kind: StatefulSet"
          helm template tb . -f examples/values-ha.yaml | grep -q "^kind: Deployment"

      - name: Helm negative cases must fail
        working-directory: deploy/helm/tool-bridge
        run: |
          set -e
          fails=(
            "-f examples/values-standalone.yaml --set replicaCount=3"
            "-f examples/values-ha.yaml --set bootstrap.shared=false"
            "-f examples/values-ha.yaml --set bootstrap.existingClaim="
            "--set replicaCount=0"
          )
          for args in "${fails[@]}"; do
            if helm template tb . $args >/dev/null 2>&1; then
              echo "危险组合未被拒绝: $args" >&2
              exit 1
            fi
          done

      - name: Zero-env Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f deploy/compose/docker-compose.yml config --quiet
          docker compose --profile replicas config --quiet
