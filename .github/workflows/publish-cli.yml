# 备注:发布走 npm Trusted Publishing(OIDC,免 token)。前置一次性配置见仓库 `docs/`
# 或 npmjs.com 包设置页:Package Settings → Trusted Publisher → GitHub Actions,
# repo `TokenRollAI/tool-bridge`,workflow `publish-cli.yml`。

name: publish-cli

on:
  push:
    tags:
      - 'cli-v*' # 打 tag 即发布:git tag cli-v0.1.0 && git push origin cli-v0.1.0
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the package to npm (normally use a cli-v* tag instead)
        type: boolean
        default: false
      publish_edge:
        description: Publish the current ref as the GHCR edge image
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm Trusted Publishing(OIDC)必需
  packages: write # 推送完整 CLI 镜像到 GHCR

jobs:
  publish-npm:
    if: github.ref_type == 'tag' || inputs.publish_npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1(setup-node 自带的可能偏旧)。
      # 钉 11.x:npm 12.0.0(2026-07-08 发布)publish 缺 sigstore 模块直接崩(MODULE_NOT_FOUND)。
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # tag 版本与 package.json 一致性校验(防止 tag 与包版本漂移)
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag cli-v$TAG_VERSION != package.json $PKG_VERSION" >&2
            exit 1
          fi

      - run: pnpm --filter @tool-bridge/core --filter @tool-bridge/cli typecheck
      - run: pnpm --filter @tool-bridge/core --filter @tool-bridge/cli test
      - run: pnpm --filter @tool-bridge/cli build

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish

  publish-image:
    # cli-v* 发布正式版本 + latest；手工 dispatch 只允许覆盖明确标成预览的 edge。
    if: github.ref_type == 'tag' || inputs.publish_edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and check CLI version
        id: version
        run: |
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "tag cli-v$TAG_VERSION != package.json $PKG_VERSION" >&2
              exit 1
            fi
          fi
          echo "value=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-cli
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_edge }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          build-args: |
            TB_VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test both published architectures
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}-cli@${{ steps.build.outputs.digest }}
          TB_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm --platform linux/amd64 "$IMAGE_REF" --version | grep -Fx "$TB_VERSION"
          docker run --rm --platform linux/arm64 "$IMAGE_REF" --version | grep -Fx "$TB_VERSION"
          docker run --rm --platform linux/amd64 "$IMAGE_REF" connect --help | grep -F -- '--fs-readonly'
          docker run --rm --platform linux/arm64 "$IMAGE_REF" connect --help | grep -F -- '--fs-readonly'
