# 备注:发布走 npm Trusted Publishing(OIDC,免 token)。前置一次性配置见 npmjs.com 包设置页:
# Package Settings → Trusted Publisher → GitHub Actions,
# repo `TokenRollAI/tool-bridge`,workflow `publish-app.yml`。
# 首次发布前该包在 npm 上尚不存在,需先手工 publish 一次再配置 Trusted Publisher。

name: publish-app

on:
  push:
    tags:
      - 'app-v*' # 打 tag 即发布:git tag app-v0.1.0 && git push origin app-v0.1.0
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing(OIDC)必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1(setup-node 自带的可能偏旧)。
      # 钉 11.x:npm 12.0.0(2026-07-08 发布)publish 缺 sigstore 模块直接崩(MODULE_NOT_FOUND)。
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # tag 版本与 package.json 一致性校验(防止 tag 与包版本漂移)
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          PKG_VERSION="$(node -p "require('./packages/app/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag app-v$TAG_VERSION != package.json $PKG_VERSION" >&2
            exit 1
          fi

      # app 把 core bundle 进产物,两包 typecheck 一起过。
      # test 是这一层自己的 Node 套件(直打 createTbApp,不经任何宿主适配器)。
      - run: pnpm --filter @tool-bridge/core --filter @tool-bridge/app typecheck
      - run: pnpm --filter @tool-bridge/core --filter @tool-bridge/app test
      - run: pnpm --filter @tool-bridge/app build

      # pnpm pack 同时应用 publishConfig 覆盖与 catalog/workspace 版本改写;
      # verifier 对最终 tarball 做协议扫描和仓库外 npm 安装,发布只能消费该 tarball。
      - name: Pack and verify npm tarball
        run: |
          TARBALL="$(node scripts/pack-and-verify-package.mjs packages/app \
            --output-dir "$RUNNER_TEMP/app")"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish "$TARBALL"
