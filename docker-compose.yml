name: tool-bridge

x-app-image: &app-image
  image: ghcr.io/tokenrollai/tool-bridge:0.22.0

services:
  init:
    <<: *app-image
    user: '0:0'
    restart: 'no'
    command: [node, /app/dist/admin.js, init]
    volumes:
      - bootstrap:/data
      - pg-secrets:/secrets/postgres
      - s3-secrets:/secrets/s3

  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: toolbridge
      POSTGRES_PASSWORD_FILE: /run/tb-postgres/password
    volumes:
      - postgres-data:/var/lib/postgresql
      - pg-secrets:/run/tb-postgres:ro
      - pg-secrets:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d toolbridge']
      interval: 5s
      timeout: 3s
      retries: 12

  objects:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [server, -ip=objects, -ip.bind=0.0.0.0, -master.peers=objects:9333, -master.telemetry=false, -s3, -s3.config=/run/tb-s3/s3.json, -dir=/data, -volume.max=32, -master.volumeSizeLimitMB=1024]
    volumes:
      - objects-data:/data
      - s3-secrets:/run/tb-s3:ro

  init-bucket:
    <<: *app-image
    user: '0:0'
    restart: 'no'
    depends_on:
      objects:
        condition: service_started
    command: [node, /app/dist/admin.js, init-bucket]
    volumes:
      - s3-secrets:/secrets/s3:ro

  app:
    <<: *app-image
    init: true
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - bootstrap:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.10.1-alpine
    profiles: [replicas]
    restart: unless-stopped
    command: [redis-server, --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  bootstrap:
  postgres-data:
  objects-data:
  pg-secrets:
  s3-secrets:
